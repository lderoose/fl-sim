[project]
name = "fl-sim"
version = "0.1.0"
description = "A PyTorch-based local simulation framework for federated learning experiments, easily configurable through a single file."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Léonard Deroose", email = "leonard.deroose@inria.fr"}
]
license = {text = "MIT"}
dependencies = [
    "isort>=8.0.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
]

[project.urls]
Repository = ""
"Author GitHub" = "https://github.com/lderoose"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "conf"]
